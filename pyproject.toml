[project]
name = "ios-loc"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pymobiledevice3>=9.38.0",
    "typer>=0.12",
    "requests>=2.32",
]

[project.scripts]
ios-loc = "ios_loc.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ios_loc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
