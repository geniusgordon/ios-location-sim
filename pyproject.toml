[project]
name = "ios-loc"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pymobiledevice3>=9.38.0",
    "typer>=0.12",
    "requests>=2.32",
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "tomli-w>=1.2.0",
]

[project.scripts]
ios-loc = "ios_loc.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ios_loc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Global timeout to catch regressions where _broadcast() blocks or spin-waits,
# which would otherwise hang the test suite indefinitely instead of failing loudly.
timeout = 60
